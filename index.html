<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef1f4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    min-height: 100%;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(20,40,70,0.18);
  }
  .card__head {
    background: #4a90d9;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: #4a90d9;
    flex-shrink: 0;
  }
  .card__name { color: #fff; font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
  .card__body { padding: 40px 26px 34px; text-align: center; }
  .barcode-wrap { width: 100%; }
  svg#barcode { width: 100%; height: auto; }
  .number {
    margin-top: 18px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #1a1a1a;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: #8a94a0;
  }
</style>
</head>

<script>
  JsBarcode("#barcode", "2621935536495", {
    format: "EAN13",
    displayValue: false,
    margin: 0,
    height: 150,
    flat: true
  });

  // Keep screen awake while the card is open (supported browsers)
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepAwake();
  });
</script>
